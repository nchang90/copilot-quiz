<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>🤖 Copilot Apps Quiz</title>
  </head>
  <body>
    <div id="app">
      <main class="quiz-shell">
        <section class="quiz-panel" aria-label="Quiz experience">
          <header class="app-header">
            <div class="app-title-block">
              <p class="app-kicker">Interactive learning mode</p>
              <h1>GitHub Copilot Apps Quiz</h1>
            </div>
            <div class="status-pills" aria-label="Interface status">
              <span class="status-pill status-pill--primary">Quiz live</span>
              <span class="status-pill">copilot-quiz-service ready</span>
            </div>
          </header>

          <div class="panel-head">
            <div>
              <p id="progress-meta" class="panel-meta">Question 1 of 10</p>
            </div>
            <div id="hud" aria-label="Quiz stats">
              <div class="stat-pill">
                <span class="stat-label">Score</span>
                <span id="score" class="stat-value">0</span>
              </div>
              <div class="stat-pill">
                <span class="stat-label">Streak</span>
                <span id="streak" class="stat-value">0</span>
              </div>
              <div class="stat-pill">
                <span class="stat-label">Progress</span>
                <span id="progress" class="stat-value">1/10</span>
              </div>
            </div>
          </div>

          <article id="question-card" class="question-card">
            <p id="question-topic" class="question-topic">Topic</p>
            <h3 id="question-text" class="question-text">Question goes here</h3>
            <div id="answers" class="answer-grid" role="list" aria-label="Answer choices"></div>
          </article>

          <section id="feedback-panel" class="feedback-panel" aria-live="polite">
            <h4 id="feedback-title" class="feedback-title">Ready?</h4>
            <p id="feedback-text" class="feedback-text">Pick an answer to see instant feedback.</p>
            <p id="feedback-explanation" class="feedback-explanation"></p>
          </section>

          <div class="action-row">
            <button id="next-btn" class="quiz-button quiz-button--primary" type="button" disabled>
              Next question
            </button>
            <button id="restart-btn" class="quiz-button is-hidden" type="button">
              Restart quiz
            </button>
          </div>
        </section>
      </main>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
